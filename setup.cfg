[flake8]
max-line-length = 88
extend-ignore = E203, W503
exclude = .git,__pycache__,migrations,venv,.venv

[isort]
profile = black
known_django = django
known_third_party = rest_framework,anthropic,factory
known_first_party = apps,profiles_ops
sections = FUTURE,STDLIB,DJANGO,THIRDPARTY,FIRSTPARTY,LOCALFOLDER

[coverage:run]
source = apps
omit =
    */migrations/*
    */tests/*
    */admin.py

[coverage:report]
show_missing = true
